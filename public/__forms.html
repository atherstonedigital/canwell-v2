<!doctype html>
<!--
  Netlify Forms detection.
  Netlify scans static HTML in the publish output at build time and registers
  any form carrying data-netlify="true". The actual user-facing forms in
  /contact and the homepage subscribe block POST to /__forms.html via fetch,
  so the request hits this static path (caught by the CDN edge) before the
  Next.js Runtime sees it. Keep the field set here in sync with the live
  forms in components/sections/ContactForm.tsx and EmailSignup.tsx.
-->
<html>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="postcode" />
      <textarea name="message"></textarea>
      <input type="text" name="referrer" />
      <input type="hidden" name="subject" />
    </form>
    <form name="newsletter" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="email" name="email" />
      <input type="checkbox" name="consent" />
    </form>
  </body>
</html>
